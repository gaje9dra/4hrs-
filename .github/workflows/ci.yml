name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fourhrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fourhrs_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fourhrs_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fourhrs_test?schema=public
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: https://example.test
      APP_VERSION: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Validate runtime configuration
        run: npm run release:validate
      - name: Run platform maturity audit
        run: npm run architecture:audit
      - name: Run reconciliation architecture audit
        run: npm run reconciliation:audit
      - name: Run synthetic architecture audit
        run: npm run synthetic:validate
      - name: Run synthetic CI safety validation
        run: npm run synthetic:ci
      - name: Run final platform certification audit
        run: npm run platform:certify
      - name: Validate production operations control plane
        run: npm run operations:validate

      - name: Audit migration safety
        run: npm run db:audit-migrations

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run migrations and tests
        run: npm test

      - name: Validate restored-state invariants
        run: npm run recovery:validate

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fourhrs_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fourhrs_build"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fourhrs_build?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fourhrs_build?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build application
        run: npm run build

  recovery-drill:
    name: Recovery Drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fourhrs_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fourhrs_recovery"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fourhrs_recovery?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fourhrs_recovery?schema=public
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run non-production backup restore drill
        run: npm run recovery:drill
