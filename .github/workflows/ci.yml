name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fourhrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fourhrs_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fourhrs_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fourhrs_test?schema=public
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: https://example.test
      APP_VERSION: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate runtime configuration
        run: npm run release:validate
      - name: Run platform maturity audit
        run: npm run architecture:audit
      - name: Run reconciliation architecture audit
        run: npm run reconciliation:audit
      - name: Run synthetic architecture audit
        run: npm run synthetic:validate
      - name: Run synthetic CI safety validation
        run: npm run synthetic:ci
      - name: Run final platform certification audit
        run: npm run platform:certify
      - name: Validate production operations control plane
        run: npm run operations:validate
      - name: Validate autonomous reliability controls
        run: npm run reliability:autonomous:validate
      - name: Validate resilience engineering controls
        run: npm run resilience:validate
      - name: Validate continuous verification and digital twin safety
        run: npm run rehearsal:validate
      - name: Validate continuous improvement governance safety
        run: npm run improvement:validate
      - name: Validate architecture evolution governance safety
        run: npm run architecture:validate
      - name: Validate platform knowledge graph safety
        run: npm run platform-graph:validate
      - name: Validate system simulation safety
        run: npm run simulation:validate

      - name: Validate change governance safety
        run: npm run change-governance:validate

      - name: Validate release governance safety
        run: npm run release-governance:validate

      - name: Validate deployment control safety
        run: npm run deployment-control:validate

      - name: Validate delivery orchestration safety
        run: npm run delivery-orchestration:validate

      - name: Validate delivery intelligence safety
        run: npm run delivery-intelligence:validate
      - name: Validate Phase 15.38 completion governance
        run: npm run delivery-intelligence:completion:validate
      - name: Final Phase 15.38 architectural readiness audit
        run: npm run delivery-intelligence:readiness:audit

      - name: Validate Phase 15.39 decision intelligence safety
        run: npm run delivery-decision-intelligence:validate

      - name: Validate Phase 15.40 governed learning safety
        run: npm run delivery-learning:validate

      - name: Validate Phase 15.41 governance intelligence safety
        run: npm run governance-intelligence:validate

      - name: Validate Phase 15.42 governance adaptation safety
        run: npm run governance-adaptation:validate

      - name: Validate Phase 15.43 governance stability safety
        run: npm run governance-stability:validate

      - name: Run Phase 16.1 production certification audit
        run: npm run production-certification:phase-16-1

      - name: Run Phase 16.2 commerce journey certification audit
        run: npm run production-certification:phase-16-2
      - name: Run Phase 16.3 payment financial safety certification audit
        run: npm run production-certification:phase-16-3


      - name: Run Phase 16.4 fulfillment Qikink certification audit
        run: npm run production-certification:phase-16-4

      - name: Run Phase 16.5 shipping and post-order certification audit
        run: npm run production-certification:phase-16-5

      - name: Run Phase 16.6 customer account and privacy certification audit
        run: npm run production-certification:phase-16-6

      - name: Run Phase 16.7 admin and RBAC certification audit
        run: npm run production-certification:phase-16-7

      - name: Audit migration safety
        run: npm run db:audit-migrations

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run migrations and tests
        run: npm test
      - name: Run Phase 16.8 database and migration certification audit
        run: npm run production-certification:phase-16-8

      - name: Run Phase 16.9 API and contract certification audit
        run: npm run production-certification:phase-16-9

      - name: Run Phase 16.10 security certification
        run: npm run production-certification:phase-16-10

      - name: Run Phase 16.23 full test matrix certification
        run: npm run production-certification:phase-16-23

      - name: Upload Phase 16.23 full test matrix evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-16-23-full-test-matrix-evidence
          path: artifacts/phase-16-23-full-test-matrix.json
          if-no-files-found: error

      - name: Run Phase 16.12 frontend accessibility certification
        run: npm run production-certification:phase-16-12

      - name: Run Phase 16.13 SEO certification
        run: npm run production-certification:phase-16-13

      - name: Run Phase 16.14 safe incident drill
        run: |
          npm run observability:incident-drill
          echo "PHASE_16_14_INCIDENT_DRILL=pass" >> "$GITHUB_ENV"

      - name: Run Phase 16.14 observability certification
        run: npm run production-certification:phase-16-14

      - name: Upload Phase 16.14 observability certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-16-14-observability-certification-evidence
          path: |
            artifacts/phase-16-14-observability-certification-evidence.json
            artifacts/phase-16-14-incident-drill-evidence.json
          if-no-files-found: error

      - name: Run Phase 16.15 background and event certification
        run: npm run production-certification:phase-16-15

      - name: Upload Phase 16.15 background and event certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-16-15-background-event-certification-evidence
          path: artifacts/phase-16-15-background-event-certification-evidence.json
          if-no-files-found: error

      - name: Run Phase 16.16 reconciliation certification
        run: npm run production-certification:phase-16-16

      - name: Upload Phase 16.16 reconciliation certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-16-16-reconciliation-certification-evidence
          path: artifacts/phase-16-16-reconciliation-certification-evidence.json
          if-no-files-found: error

      - name: Upload Phase 16.13 SEO certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-16-13-seo-certification-evidence
          path: artifacts/phase-16-13-seo-certification-evidence.json
          if-no-files-found: error

      - name: Upload Phase 16.12 frontend accessibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-16-12-frontend-accessibility-evidence
          path: artifacts/phase-16-12-frontend-accessibility-evidence.json
          if-no-files-found: error

      - name: Validate restored-state invariants
        run: npm run recovery:validate
      - name: Run synthetic rehearsal test suite
        run: npm run rehearsal:test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fourhrs_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fourhrs_build"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fourhrs_build?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fourhrs_build?schema=public
      NEXT_PUBLIC_SITE_URL: https://example.test
      APP_VERSION: ci-performance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build application
        run: npm run build

      - name: Start production server for controlled performance certification
        run: |
          npm start > /tmp/next-performance.log 2>&1 &
          echo $! > /tmp/next-performance.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null

      - name: Run Phase 16.11 controlled runtime benchmark
        env:
          PERF_BASE_URL: http://127.0.0.1:3000
        run: |
          export NEXT_SERVER_PID=$(cat /tmp/next-performance.pid)
          npm run performance:benchmark:phase-16-11

      - name: Run Phase 16.22 synthetic production smoke certification
        env:
          PHASE_16_22_BASE_URL: http://127.0.0.1:3000
          PHASE_16_22_RUN_ID: phase-16-22-${{ github.run_id }}-${{ github.run_attempt }}
          PHASE_16_22_ALLOW_LOCAL_SYNTHETIC: "true"
          SYNTHETIC_EXECUTION_MODE: CI
          SYNTHETIC_MONITORING_ENABLED: "true"
          SYNTHETIC_ALLOWED_BASE_URL: http://127.0.0.1:3000
          SYNTHETIC_PAYMENT_MODE: boundary
          SYNTHETIC_PROVIDER_MODE: disabled
          SYNTHETIC_NOTIFICATION_MODE: suppress
          FULFILLMENT_PROVIDER_MODE: test
        run: npm run production-certification:phase-16-22

      - name: Upload Phase 16.22 smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-16-22-synthetic-production-smoke-evidence
          path: artifacts/phase-16-22-synthetic-production-smoke-test.json
          if-no-files-found: error

      - name: Run Phase 16.11 performance certification
        run: npm run production-certification:phase-16-11

      - name: Upload Phase 16.11 performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-16-11-performance-evidence
          path: artifacts/phase-16-11-*.json
          if-no-files-found: error

      - name: Stop performance certification server
        if: always()
        run: |
          if [ -f /tmp/next-performance.pid ]; then kill $(cat /tmp/next-performance.pid) || true; fi
          cat /tmp/next-performance.log || true

  recovery-drill:
    name: Recovery Drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fourhrs_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fourhrs_recovery"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fourhrs_recovery?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fourhrs_recovery?schema=public
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Run Phase 16.17 backup and disaster recovery certification
        env:
          RUN_PHASE_16_17_RECOVERY_DRILL: "true"
        run: npm run production-certification:phase-16-17

      - name: Upload Phase 16.17 recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-16-17-backup-disaster-recovery-evidence
          path: |
            artifacts/phase-16-17-backup-disaster-recovery-certification-evidence.json
            artifacts/phase-16-17-recovery-drill-evidence.json
          if-no-files-found: error

      - name: Run Phase 16.18 resilience and failure-injection certification
        run: npm run production-certification:phase-16-18
      - name: Run Phase 16.19 release and deployment certification
        run: npm run production-certification:phase-16-19
      - name: Run Phase 16.20 production configuration certification
        run: npm run production-certification:phase-16-20
      - name: Run Phase 16.21 dependency and supply-chain certification
        run: npm run production-certification:phase-16-21


      - name: Upload Phase 16.18 resilience evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-16-18-resilience-failure-injection-evidence
          path: artifacts/phase-16-18-resilience-failure-injection-evidence.json
          if-no-files-found: error
