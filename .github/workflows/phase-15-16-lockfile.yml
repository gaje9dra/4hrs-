name: Generate package lock artifact

on:
  push:
    branches:
      - phase-15-16-release-engineering-zero-downtime

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'chore: add npm lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Generate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit authoritative lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: add npm lockfile"
          git push
